
name: Valhalla EA

on:
  workflow_dispatch:
#  push:
#  pull_request:
  schedule:
    - cron: '39 1 * * 1,3,5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java_version: [EA] ## value classes ship as a preview feature in mainline EA
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: oracle-actions/setup-java@v1
      with:
        website: jdk.java.net
        release: ${{ matrix.java_version }}
    - name: Maven cache
      uses: actions/cache@v6
      env:
        cache-name: maven-cache
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/io/avaje
        key: valhalla-${{ env.cache-name }}-${{ matrix.os }}-${{ matrix.java_version }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          valhalla-${{ env.cache-name }}-${{ matrix.os }}-${{ matrix.java_version }}-
    - name: Maven version
      run: mvn --version
    # Build the maven plugin before the valhalla prep: with --release set to the EA JDK its
    # classes are major 72, and maven-plugin-plugin:descriptor scans them with ASM, which has
    # no release supporting that version yet.
    - name: Install maven plugin
      run: mvn install -pl inject-maven-plugin -am -DskipTests
    - name: Prepare
      run: java Jakarta2Valhalla.java
    - name: Build with Maven
      run: mvn package -pl '!inject-maven-plugin'
