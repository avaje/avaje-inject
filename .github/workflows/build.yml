name: Build

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java_version: [21]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java_version }}
        distribution: 'zulu'
    - name: Maven cache
      uses: actions/cache@v6
      env:
        cache-name: maven-cache
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/io/avaje
        key: build-${{ env.cache-name }}-${{ matrix.os }}-${{ matrix.java_version }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          build-${{ env.cache-name }}-${{ matrix.os }}-${{ matrix.java_version }}-
    - name: Maven version
      run: mvn --version
    - name: Build with Maven
      run: mvn clean install
    - name: Build with Maven (javax)
      run: java Jakarta2Javax.java && mvn clean install && java Javax2Jakarta.java
